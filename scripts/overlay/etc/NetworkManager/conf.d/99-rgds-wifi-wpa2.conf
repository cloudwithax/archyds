# RTL8821CS does not support WPA3/SAE. Force NM to default new wifi
# connections to WPA2-PSK with PMF disabled so it won't try SAE first
# on networks that advertise WPA3 transition mode.
[connection-rgds-wifi-wpa2]
match-device=interface-name:wlan0
802-11-wireless-security.key-mgmt=wpa-psk
802-11-wireless-security.pmf=1
