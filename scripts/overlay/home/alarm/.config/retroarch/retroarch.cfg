# RG DS RetroArch defaults. RetroArch rewrites this file on exit; these are just
# the initial values so cores, core info, and the BIOS/system directory resolve
# correctly out of the box and the menu is gamepad-friendly.

libretro_directory = "/usr/lib/libretro"
libretro_info_path = "/usr/share/libretro/info"
core_info_directory = "/usr/share/libretro/info"
system_directory = "/home/alarm/RetroArch/BIOS"

video_fullscreen = "true"
video_driver = "gl"
menu_driver = "ozone"
menu_show_load_content_animation = "false"

# Let RetroArch grab the pad on its own; ES-DE configures its own input.
input_autodetect_enable = "true"
input_max_users = "4"

# Don't nag about missing optional content/thumbnails on a fresh image.
menu_show_core_updater = "true"
content_show_favorites = "true"
